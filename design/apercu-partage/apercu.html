<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Aperçu de partage — source de public/apercu-partage.png</title>
<!-- Exporter en 1200 × 630 : node design/apercu-partage/exporter.mjs -->
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--noir:#000;--trait:#2c2b28;--craie:#ecebe4;--craie-2:#a9a79d;--craie-3:#85837a;--jaune:#f2c94c;--rouge:#e86a5a}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:var(--noir);color:var(--craie);font-family:"Atkinson Hyperlegible Next",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.ardoise{display:grid;grid-template-columns:1fr 420px;gap:48px;height:100%;padding:76px 72px 70px}
.gauche{display:flex;flex-direction:column}
.icone{width:72px;height:72px}
h1 u{text-decoration:none;border-bottom:4px solid var(--craie);padding-bottom:6px}
h1{margin-top:34px;font-size:64px;font-weight:800;line-height:1.04;letter-spacing:-.025em}
p{margin-top:24px;font-size:30px;line-height:1.3;color:var(--craie-2);max-width:24ch}
.fan{margin-top:auto;font-size:24px;color:var(--craie-3)}
.droite{display:flex;flex-direction:column;justify-content:center;border-left:4px solid var(--trait);padding-left:48px}
.label{font-size:26px;color:var(--craie-2);letter-spacing:.02em}
.pv{display:flex;align-items:baseline;gap:10px;white-space:nowrap;margin-top:6px}
.pv s{font-size:48px;font-weight:700;color:var(--rouge);text-decoration-thickness:6px}
.pv b{font-size:176px;font-weight:800;line-height:.92;letter-spacing:-.03em}
.pv span{font-size:44px;font-weight:500;color:var(--craie-2)}
</style>
</head>
<body>
<div class="ardoise">
  <div class="gauche">
    <svg class="icone" viewBox="0 0 512 512" aria-hidden="true"><rect x="116" y="116" width="280" height="280" rx="56" fill="none" stroke="#f2c94c" stroke-width="28"/><g fill="#ecebe4"><circle cx="196" cy="196" r="26"/><circle cx="316" cy="196" r="26"/><circle cx="196" cy="316" r="26"/><circle cx="316" cy="316" r="26"/></g></svg>
    <h1>Compagnon de<br><u>La Saga de Dagda</u></h1>
    <p>La feuille d'aventure du livre‑jeu, sur votre téléphone.</p>
    <div class="fan">Projet de fan non officiel</div>
  </div>
  <div class="droite">
    <div class="label">Points de vie</div>
    <div class="pv"><s>31</s><b>28</b><span>/ 32</span></div>
  </div>
</div>
</body>
</html>
